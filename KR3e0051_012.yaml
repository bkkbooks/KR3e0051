body:
  text: 儒門事親卷十二金張從正撰吐劑三聖散防風三兩去蘆苽蒂三兩摶净碾破以蒂卷定連紙銼細去紙用粗羅子羅過另放末將滓炒微黃次入末一處同炒黃用藜蘆去苗及心加減用之或一兩或半兩或一分右各為粗末每服約半兩以虀汁三茶盞先用二盞煎三五沸去虀汁次入一盞煎至三沸却將原二盞同一處熬二沸去滓澄清放溫徐徐服之不必盡劑以吐為度苽蒂散苽蒂七十五箇赤小豆七十五箇人參半兩去蘆甘草半兩或二錢五分右為細末每服一錢或半錢或二錢量虛實加減用之空心虀汁調下服之稀涏散猪牙皂角不蛀者去支弦稱一兩炙用之碌礬藜蘆半兩右為細末每服半錢或一二錢斡開牙關漿水調下灌之蔚金散蔚金滑石川芎各半兩右為細末每服一二錢量虛實加減以虀汁調下空心服之茶調散亦一名二仙散苽蒂不以多少好茶中停右為細末每服二錢虀汁調下空心用之獨聖散苽蒂不以多少右為細末每服一錢或二錢虀汁調下服之脅痛加全蝎頭痛加蔚金碧雲散治小兒驚風有涎膽礬半兩銅青一分粉霜一錢輕粉一分右研為細末每服一字薄荷湯調下用之如中風用漿水調服常山散常山二兩甘草二兩半右為細末水煎服之空心青黛散猪牙皂角乙箇𤣥胡索乙箇青黛少許右為細末鼻內灌之其涏自出汗劑防風通聖散防風川芎當歸芍藥大黃薄荷􅏘黃去根不去節連翹芒硝已上各半兩石膏黃芩桔梗巳上各二兩滑石三錢甘草二兩荆芥白术山梔子已上各乙兩右為粗末每服五七錢水一大盞生薑三片煎至七分去滓熱服如涏嗽加半夏五錢生薑製過雙解散通聖散與益元散相合中停水一鍾生薑豆豉䓤白同煎浮萍散治癩風浮萍乙兩荆芥川芎甘草􅏘黃去根已上各一兩或加當歸芍藥右為粗末每服一兩水二盞煎至七分去滓溫服汗出則愈升􅏘湯升􅏘去土葛根芍藥甘草炒已上各一兩右為粗末每服三錢水一盞半煎至七分去滓溫服不計時候􅏘黃湯􅏘黃乙兩去根官桂七錢甘草三錢干炙杏仁二十二箇去皮尖麩炒黃色用右為粗末每服三錢水一中盞煎至七分去滓溫服汗出自解桂枝湯桂枝乙兩茯苓半兩芍藥乙兩甘草七錢右為粗末每服三錢水一盞生薑棗一同煎去滓溫服下劑導水丸大黃二兩黃芩二兩滑石四兩黑牽牛四兩另取頭末用加甘遂一兩去濕熱腰痛泄水濕腫滿久病則加加白芥子一兩去遍身走注疼痛加朴硝一兩退熱散腫毒止痛久毒宜加加郁李仁一兩散結滯通關節潤腸胃行滯氣通血脈樟柳根一兩去腰腿沉重右為細末滴水丸梧桐子大每服五十丸或加至百丸臨卧溫水下禹功散黑牽牛頭末四兩茴香乙兩炒或加木香乙兩右為細末以生薑自然汁調一二錢臨卧服通經散陳皮去白當歸各乙兩甘遂以麵包不令透水煮百餘翻取出用冷水浸過去麵焙乾右為細末每服三錢溫湯調下臨卧服神祐丸甘遂依前製用大㦸焙浸煮醋乾用芫花醋浸煮各半兩黑牽牛乙兩大黃乙兩右為細末滴水丸小豆大每服五七十丸臨卧溫水下琥珀丸右為前神祐丸加琥珀一兩是也益胃散甘遂依前製過用右為細末每服三錢以獖猪腰子細批破以鹽椒等物淹透爛切摻藥在內以荷葉裹燒熟溫淡酒調服大承氣湯大黃半兩厚朴乙兩枳實一枚麩炒芒硝半兩右為粗末每服三五錢水一盞煎至七分去滓服以意加減小承氣湯大黃厚朴已上各乙兩枳實乙枚右為粗末同前煎服調胃承氣湯大黃甘草灸朴硝已上各半兩右為粗末每服五七錢水一盞煎三五沸去滓溫服食後桃仁承氣湯桃仁去皮尖乙十二個官桂甘草芒硝已上各半兩右銼如􅏘豆大每服三五錢水一大盞煎至七分去滓溫服玉井散苽蔞根二兩甘遂乙兩製用右為細末以麝香湯調下三錢臨卧服水煮桃紅丸黑牽牛頭末半兩苽蒂末二錢雄黃乙錢水飛過用之乾胭脂少許右以黃水調麵為丸以水煮令浮熟取出冷水拔過射香湯下無憂散黃蓍木通桑白皮陳皮已上各乙兩胡椒白术木香各半兩牽牛頭末四兩右為細末每服三五錢以生薑自然汁調下食後泄水丸又方藏用丸一料加芒硝半兩啇陸半兩為末水丸依前服大㦸芫花甘遂海帶海藻郁李仁續隨子已上各半兩樟柳根乙兩右為細末水煮棗肉為丸如小豆大每服五七十丸水下牛黃通膈丸黑牽牛大黃木通已上各半兩各另取末右為細末水丸如黍粒大量兒大小三五十丸或百丸水下四生丸一名潤腸丸黑牽牛大黃朴硝皂角去皮絃蜜灸已上各等分右為細末水丸如梧桐子大每服七八十丸食後溫水下內托散大黃牡蠣已上各半兩甘草三錢苽蔞二箇右為末水一大盞煎三五沸去滓露冷服藏用丸大黃黃芩已上各二兩滑石黑牽牛各四兩右為末水丸桐子大每服五七十丸食後溫水下神芎丸藏用丸一料內加黃連薄荷川芎各半兩水丸桐子大水下進食丸牽牛乙兩芭豆三箇去油心膜右為末水丸每服二三十丸食後隨所傷物送下牛黃白术丸治腰腳濕黑牽牛末大黃已上各二兩白术乙兩右為末滴水丸桐子大每服三十丸食前生薑湯下要利加至百丸玉燭散以四物湯承氣湯朴硝各等分水煎去滓食前服三和湯以四物湯凉膈散當歸各中停水煎服丁香化癖散治小兒脾白丁香蜜陀僧舶上硫黃已上各乙錢碙砂半錢輕粉少許右研細末每兒一歲服半錢男病女乳調女病男乳調後用通膈泄扺當湯水蛭十箇虻蟲十箇去翅足熬大黃乙兩桃仁七枚去皮尖槌右銼如􅏘豆作一服水二盞煎至七分去滓溫服扺當丸虻蟲五箇桃仁六枚大黃三分水蛭五箇右為細末只作一丸水一大盞煮一丸至七分頓服十棗湯紫芫花醋浸煮大㦸甘遂製已上各等分右為末每服半錢水一盞棗十枚同煎取半盞服除濕丹檳榔甘遂威靈仙赤芍藥澤瀉葶􅏣已上各二兩乳香别研沒藥别研已上各一兩黑牽牛末半兩大㦸三兩炒陳皮四兩去白右為細末麵糊和丸如桐子大每服三五十丸水下利膈丸牽牛四兩生槐角子乙兩炒木香乙兩青皮乙兩皂角去皮酥炙半夏洗各二兩右為細末生薑麵糊為丸桐子大每服四五十丸水下三一承氣湯大黃芒硝厚朴去皮枳實已上各半兩甘草乙兩右銼如􅏘豆大每服半兩水一大盞生薑三片煎至六分入硝去滓熱服大陷胸湯大黃乙兩半芒硝乙兩八錢半甘遂末一字右為水一盞煮大黃至八分去滓入硝一沸下甘遂末溫服小陷胸湯半夏湯洗乙錢半黃連乙分苽蔞實一枚用四分之一右銼􅏘豆大水二盞先煮苽蔞至一盞半下諸藥取八分去滓溫服未利再服握宣丸檳榔肉桂乾薑附子甘遂良薑韭子芭豆已上各等分入硫黃乙錢右為細末軟米和丸桐子大早辰先椒湯洗手放溫揩乾用生油少許泥手心男左女右磨令熱握一丸宣一二行風門防風通聖散方在汗門中附防風天􅏘散防風天􅏘川芎羌活白芷草烏頭荆芥當歸甘草滑石白附子已上各半兩右為末熱酒化蜜少許調藥半錢加至一錢少時覺藥行微􅏘為度如作丸煉蜜和彈子大熱酒化下一丸或半丸防風湯防風􅏘黃獨活秦艽去蘆黃芩石膏當歸白术已上各半兩右為粗末入半夏片子令攪勻每服四錢水二中盞入生薑七片煎至一盞去滓取清汁六分入麝香少許帶熱食後服祛風丸川烏炮去皮臍草烏炮天南星半夏薑製蒸豆粉甘草川芎殭蠶藿香苓苓香地龍去土蝎稍炒已上各一兩川薑半兩右為細末藥末一兩用蒸豆粉一兩以白麵二兩滴水和丸如桐子隂乾細嚼茶清下三五丸至五七丸食後初服三丸以漸加之排風湯當歸去蘆杏仁去皮尖麩炒防風去蘆白蘚皮白术芍藥官桂去粗皮川芎甘草炒各三兩獨活􅏘黃去節茯苓去皮各三兩右為粗末每三錢水一盞半入生薑四片同煎至八分去滓溫服不計時候小續命湯􅏘黃去節人參去蘆黃芩芍藥川芎甘草炙杏仁湯炮去皮尖炒防己官桂去皮防風去蘆各一兩附子半兩去皮臍右除附子杏仁外合搗為粗末後入二味攪勻每服三錢水一盞半入生薑五片煎至一盞去滓少熱服食後消風散川芎羌活去蘆人參去蘆白茯苓去皮白殭蠶炒蟬殼去土已上各一兩陳皮去白厚朴去粗皮薑製已上各半兩右為細末每服二錢茶清調下川芎散川芎荆芥甘菊薄荷蟬殼蔓精子已上各二兩甘草乙兩炙右為細末茶酒任下三二錢食後搜風丸單名人參半夏丸人參茯苓南星已上各半兩半夏乾生薑白礬生凝水石已上各一兩蛤粉二兩薄荷半兩藿香右為細末與藏用丸末各中停水丸如豌豆大每服三十丸生薑湯送下當歸川芎散當歸川芎已上各半兩甘草二兩黃芩四兩薄荷乙兩􅒦砂仁一分右為細末溫水調下一二錢愈風餅子川烏半兩炮裂川芎甘菊白芷防風細辛天􅏘羌活荆芥薄荷甘草炙已上各一兩右為細末水浸􅔻餅為劑揑作餅子每服三五餅子細嚼茶酒送下不計時候疏風丸通聖散一料加天􅏘羌活獨活細辛甘菊首烏各半兩右為細末煉蜜和丸彈子大朱砂為衣每服一丸細嚼茶酒下通頂散石膏川芎瓜蒂已上各等分藜蘆少許右為細末鼻內㗜胃風湯人參去蘆茯苓去皮川芎官桂當歸芍藥白术右件各等分為末每服三錢水一盞入陳粟米煎空心服之香芎散香附子炒貫芎石膏水飛白芷甘草薄荷已上各一兩川烏半兩炒去皮臍右為細末每服二錢溫酒茶清調下無時鐵彈丸地龍去土防風白膠香沒藥木鱉去皮草烏頭水浸炮白芷五苓脂當歸已上各用一兩細墨三錢麝香另研乳香另研升麻各二錢右末糯粥丸彈子大每服一丸生姜酒下暑門瘧附白虎湯知毋乙兩半去皮甘草乙兩糯米乙合石膏四兩亂紋者另為末右銼如麻豆大粳米拌勻另水一盞煎至六分去滓溫服無時日三四服或眩嘔者加半夏半兩薑製桂苓甘露散官桂半兩人參藿香已上各半兩茯苓白术甘草葛根澤瀉石膏寒水石已上各一兩滑石二兩木香乙分右為細末每服三錢白湯㸃下新水或生薑湯亦可化痰玉壺丸南星半夏並生用天􅏘已上各半兩白麵三兩右為細末滴水丸如桐子大每服三十丸用水一大盞先煎令沸下藥煮候浮即熱漉出放溫别用生薑湯下不拘時服益元散滑石六兩甘草乙兩右為細末每服三錢蜜水新水調下玉露散治暑寒水石滑石石膏苽蔞根已上各四兩甘草二兩右為細末每服五錢重新水調下石膏散石膏乙兩人參去蘆甘草灸各半兩右為細末新水蜜水調三錢生薑湯亦可辰砂丹治瘧信乙錢雄黑豆六十箇或二兩重右為細末朱砂為衣端午日合不令雞犬婦人見每服一丸無根水下溫脾丸信乙錢甘草二錢紫河車三錢豆粉四兩右為末滴水丸每服半錢作十丸臨卧無根水下溫脾散紫河車菉豆已上各一兩甘草半兩砒乙錢别研右為細末後入砒研勻每服半錢新水盞調下如是隔日發直待臨睡服藥如頻日發只夜深服忌葷酒魚兔等濕門嗽附五苓散官桂澤瀉猪苓去黑皮茯苓去皮白术各半兩右為細末每服二錢熱湯或新水調下葶􅏣木香散苦葶􅏣茯苓去皮猪苓去皮已上各一分木香半錢澤瀉木通甘草各半兩官桂乙分滑石三錢右為細末每服三錢生薑湯調下食前服白术木香散白术猪苓澤瀉赤茯苓各半兩木香檳榔各三錢陳皮二兩去白官桂乙錢滑石三兩右為細末每服五錢水一盞生薑三片同煎至六分溫服食後大橘皮湯橘皮乙兩半木香乙分滑石六兩檳榔三錢茯苓乙兩猪苓去黑皮澤瀉白术官桂已上各半兩甘草二錢右為末每服五錢水一盞生薑五片煎至六分去滓溫服食後神助散苦葶􅏣三兩炒黑牽牛三兩半微炒取頭末用澤瀉