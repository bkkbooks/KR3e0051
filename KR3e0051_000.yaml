body:
  text: 儒門事親醫家類提要臣等謹案儒門事親十五卷金張從正撰從正字子和號戴人睢州考城人興定中召補太醫尋辭去與麻知幾常仲明輩講求醫理輯為此書有説有辨有記有解有誡有箋有詮有式有斷有論有疏有述有衍有訣有十形三療有六門三法名目頗煩碎而大旨主於用攻其曰儒門事親者以為惟儒者能明其理而事親者當知醫也從正宗河間劉守真用藥多寒涼其汗吐下三法當時已多異議故書中辨謗之處為多丹溪朱震亨亦譏其偏後人遂并其書置之然病情萬狀各有所宜當攻不攻與當補不補厥弊維均偏執其法固非竟斥其法亦非也惟中間負氣求勝不免太激欲矯庸醫恃補之失或至于過直又傳其學者不知察脈虗實論病久暫概以峻利施治遂致為世所藉口要之未明從正本意耳乾隆四十三年三月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀儒門事親原序是書也戴人張子和専為事親者著論議淵微調攝有法其術與東垣丹溪並傳名書之義蓋以醫家奧旨非儒不能明藥裹酒食非孝不能備也故曰為人子者不可不知醫豫幼失怗慈親在堂踰七望八􅎵髓既具未嘗不防以藥物每慮當有所饋委之時醫恐為盡道之纍將欲遍閲方書諸家著述繁雜竊為是皇皇者數載矣近得是書如獲寶璐執是以證何慮臆説之能惑惜其板久失傳本多亥豕之訛因付儒醫聞忠較訂鋟梓與世之事親者共云嘉靖辛丑三月戊子復元道人邵輔序
