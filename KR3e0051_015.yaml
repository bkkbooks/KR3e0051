body:
  text: 儒門事親卷十五金張從正撰瘡瘍癰腫第一治螻蛄瘡良薑白芨瀝青已上各等分右為細末嚼芝蔴水同熬為膏入冷水共定用緋絹片火熨斗作膏藥貼瘡上又方千年石灰茜根燒灰右為細末用水調雞翎塗上水沉金絲膏貼一切惡瘡瀝青白膠已上各一兩春秋宜用油夏宜油臈二錢半冬宜用油䗶四錢右件鎔開油䗶下瀝青白膠用槐枝攪勻綿子濾過入冷水中扯一千餘遍如瘡透了喫數丸作劑於瘡口填者亦妙攤紙上貼勿令火炙乳香散治下疳乳香沒藥輕粉黄丹龍骨烏魚骨黄連黄芩銅碌已上各等分麝香少許右為細末先以温漿水洗過貼疳瘡上治蛇傷方右用蒲公英科根作埿貼于傷處用白麵膏藥貼之紫金丹治疔瘡白礬四兩黄丹二兩右用銀石器内鎔礬作汁下丹使銀釵子攪之令紫色成也用文武火無令太過不及如有瘡先以週圍挑破上藥用唾津塗上數度着無令瘡乾其瘡潰動取疔出也兼瘡顔色紅赤為効如藥末成就再杵碎炒令紫色治疔瘡生蜜與隔年葱一處研成膏右先將瘡週迴用竹鍼刺破然後用瘡藥於瘡上攤之用緋絹蓋覆如人行二十里覺疔出然後以熱醋湯洗之千金托裏散治一切發背疔瘡連翹一兩二錢黄蓍一兩半厚朴二兩川芎一兩防風二兩桔梗二兩白芷一兩芍藥一兩官桂一兩木香三錢乳香三錢半當歸半兩没藥三錢甘草一兩人參半兩右為細末每服三錢用酒一椀盛煎三沸和滓温服膏子貼之二聖散治諸瘡腫黄丹二兩白礬二兩飛右為細末毎服乾摻瘡口上後用保生錠子揑作餅子貼之保生錠子芭荳四十九箇另研文武火燒熱金脚信二錢雄黄三錢輕粉半匣碙砂二錢麝香二錢右件為末用黄䗶一兩半化開将藥和成錠子冷水浸少時取出旋揑作餅子如錢眼大將瘡頭撥破毎用貼一餅子次用神聖膏藥封貼然後服托裏散若瘡氣透裏危者服破棺散用神聖膏神聖膏藥貼治一切惡瘡當歸半兩没藥三錢白芨二錢半乳香三錢藁本半兩琥珀二錢半黄丹四兩木鱉子五箇去皮膽礬一錢粉霜一錢黄䗶二兩白膠三兩芭荳二十五箇去皮槐柳枝一百二十條各長一把清油一斤右件一處先將槐柳枝下油内煑焦取出次後下其餘藥物煑得極焦亦撈出却將油澄清再熬成膏子用緋絹上攤破棺丹大黄一兩半甘草二兩荆三稜一兩半山梔子二兩半牽牛末二兩右為細末煉蜜為丸如彈子大每服半丸食後酒半盞研化服之忌冷水三聖散治臁瘡疔瘡搭手背疽等瘡葱白一斤馬莧一斤石灰一斤右三味濕搗為團隂乾為細末貼瘡如有死肉者宜先用潰死肉藥潰死肉藥方炊飯尖半兩各三等一等半兩入芭荳二箇一等半兩入芭荳三箇一等半兩入芭荳五箇各撚作白錠子右先用二芭荳納瘡如不潰再用納三芭荳又不潰用五芭荳者更用丹砂炒紅色摻瘡口追出清水其惡肉未盡至追出赤水是惡肉盡更用三聖散貼上用膏藥傅之治臁瘡久不愈者以川烏頭黄蘗各等分為末用唾津調塗紙上貼之治一切惡瘡方以天茄葉貼之或為細末貼之亦妙又方用臈月人中白燒灰油調塗瘡疥上又方以瓦松不以多少隂乾為末先用槐枝葱白湯洗之過摻之立効灸瘡久不斂者更妙又方以蒲公英搗之貼一切惡瘡諸刺替針丸治一切惡瘡川烏二錢草烏二錢五靈脂二錢輕粉一分粉霜一分又方加斑貓二十箇去足翅用芭荳二十箇去皮用右將三件為末硏令勻次入輕粉粉霜研勻又入斑貓芭荳以水調糊為錠子如作散是謂針頭散懸蔞散治發背惡瘡懸蔞一箇大黄一兩金銀花一兩當歸半兩皂角刺一兩右剉碎用酒一椀煎至七分去滓温服如有頭者加黍粘子治附骨癰及一切惡瘡當歸半兩甘草一兩山梔子十二箇木鱉子一箇右為細末每服三五錢冷酒調服之治諸惡瘡白殭蚕直者大黄二味各等分右為細末生薑自然汁與蜜同和為劑丸如弹子大毎服一丸細嚼治惡瘡死肉鋌子芭荳一錢去皮油五靈脂半兩黄丹二錢飛加枯白礬一錢右為細末以糊和丸鋌子入瘡内用之當歸活血散治瘡瘍未發出内痛不可忍及婦人産前後腹痛當歸二錢没藥一錢半乳香半錢白芍藥三錢瘡瘍者加人參木香婦人加赤芍藥右為細末每服一錢水一中盞煎至七分和滓温服日二服婦人酒煎瘡既發不湏用薰惡瘡方紫花地丁一名米布代收右取根㬠乾用四箇半頭塼壘成爐子燒着地丁用絡垤塼一枚蓋了使令塼眼内煙出薫惡瘡出黄水自愈治虵瘡用蒲公英科根作埿貼于傷處用白膏藥封之接骨散并治惡瘡金頭蜈蚣一箇金色自然銅半兩燒紅醋碎研為細末用之乳香二錢為細末用之銅錢重半兩者取三文或五文燒紅醋碎研細金絲水蛭一錢半毎箇作三截瓦上漙去氣道為度沒藥三錢研細右為細末如瘡腫處津調半錢塗立止痛如見得出膿先用麄藥末少許小油少半匙同打勻再入少半匙再打勻又入前藥接骨散半錢再都用銀釵子打成膏子用雞翎掃在瘡腫處立止痛天明一宿自破便効如打折骨頭并損傷可用前項接骨散半錢加馬兠苓末半錢同好酒一大盞熱調連滓温服如骨折損立接定不疼如不折了喫了藥立便止住疼痛此方屢經効騐不可具述服藥覷可以食前服食後服又外用接骨藥陳爛麻根兩把羊耳朶一對亂絲一握多者更妙右取肥松節劈碎約量多少先放三兩根於新瓦上都於上外三味在上燒着存性就硏為末如生再燒研為度後入五靈脂或半兩如疼入好乳香少許和藥如茶褐色為度用布條子約纒一遭先攤小黄米粥勻上撒上藥末勻纒定折處上又用軟帛三五重上又竹箪子纒勒得𦂳慢得中初三日換上一次再後五日換一次又七日再換上一次無有不接者赤龍散消散一切腫毒野蔔桃根紅者去麄皮為末新水調塗腫上頻掃新水便癰方本名血疝牡蠣大黄甘草已上各半兩懸蔞一箇右酒浸露一宿服之以利為度又方冬葵子為末酒調下三兩服又方皂角不蛀者燒過隂乾為末酒調服立効皂角子七箇水服之亦効又方胡桃七箇燒過隂乾硏為末酒調服之不過三服又方生蜜米粉調服休喫飯利小便為度治瘡無頭者蛇退皮於腫處貼之又方皂角刺燒灰隂乾右為末毎服三錢酒調嚼葵菜子三五箇前藥送下生肌歛瘡藥白蘞定粉各等分黄丹少許右同為細末洗凈瘡口乾貼之治諸瘡水度腫者生白礬末水調塗之自消接骨藥銅錢半兩醋焦燒研為末木香一錢自然銅一錢麝香少許右為極細末如在上食後毎服三匙頭嚼丁香一枚乳香一粒無灰酒一小盞在下食前如不折其藥反出服罷其痛不可當勿疑待一日如骨未接再服如前老者十餘日少者不過五七日萬聖神應丹出箭頭茛菪科一名天仙子取着中一科根本枝葉花實全者好右於端午日前一日持不語尋見茛菪科言道先生你却在這裏那道罷用柴灰自東南為頭圍了用木椑子撅取了根週迴土次日端午日未出時依前持不語用鑊口一鑊取出土用净水洗了不令雞犬婦人見於净室中以石臼搗為泥丸如弹子大黄丹為衣以紙袋封了懸於髙處隂乾如有人着箭不能出者用緋絹盛此藥訖放臍中用綿裹肚繫了先用象牙末於瘡口上貼了後用前藥如瘡口生合用刀子利開貼之治凍瘡臘月雀腦子燒灰研細小油調塗凍瘡口上又方以正黄蘗為細末用乳汁調塗瘡口上又方山藥少許生於新瓦上磨為埿塗瘡口上治手足裂白芨不以多少為末水調塗裂處治靣上瘡用𨫼子底黑煤於小油中以匙打成膏子攤在紙上瘡上貼之治金瘡血不止白薇末貼之立止善應膏藥黄丹二斤南乳香别研没藥别研當歸木鱉子生用白蘞生用白礬生用官桂三寸杏仁生白芷已上各一兩新柳枝各長一寸右除黄丹乳末等外八件用芝麻油五斤浸一宿用鐡鍋内煎令黄色藥不用次入黄丹鍋内柳條攪令黄色方可掇下用柳枝攪出大煙入乳沒勻令冷傾在磁盆内候藥硬用刀子切作塊子油紙封裹接骨丹五靈脂一兩茴香一錢右二味為細末另研乳香為細末於極痛處摻上用小黄米粥塗了後用二味藥末摻於上再用帛子裹了用木片子纒了少壮人二日効老者五六日効治癬如聖丸黄蘖黄芩黄連防風已上各半兩白殭蚕一兩全蝎三分輕粉半錢右為細末羊蹄根汁浸蒸餅為丸如梧桐子大毎服二三十丸嚼羊蹄根汁送下隨病人上下分食前後又羊蹄汁塗癬治小兒癬雜瘡白膠香黄蘗輕粉右為細末羊骨髓調塗癬上治瘰癧方斑猫去頭翅足赤小荳白殭蚕苦丁香白丁香磨刀泥右各等分為細末十歳已上服一錢二十已上服二錢五更用新汲水一盞調下比至辰時見効女人小便見赤白色三兩次男子於大便中見赤色白色為効當日服白粘粥不得喫别物大忌油膩患三四年者只一服七八年者再一服玉餅子治瘰癧一切惡瘡軟癤右用白膠一兩磁器内鎔開去滓再於磁開後以萆蔴子六十四箇作泥入膠内攪勻入小油半匙頭柱㸃水中試硬軟添减膠油如得所量瘡大小以緋帛攤膏藥貼之一膏藥可治三五癤又方治瘰癧小龍肚腸一條炮乾鱉殻裙襴炮川練子五箇牡蠣大黄牛旁子燒存性皂角子五十箇右為細末蒸餅為丸如菉荳大每服十五丸食後艾湯下日三服又方將臘月猫糞用新瓦兩箇合在内外用鹽泥固濟燒成灰以小油調塗瘡口上又方取小左盤龍不以多少為末陳米飯搜和得所丸如梧桐子大毎服三五十丸却用陳米湯送下治眉煉頭瘡小麥不以多少燒冷黑色存性為末以小油調塗瘡上治小兒痜瘡羊糞熬湯洗去痂用屋懸煤炒羅為末以小油塗瘡上聖靈丹治打撲肭損痛不可忍者乳香三錢另研烏梅五箇去核細切焙乾為末白萵苣子二兩八錢炒黄搗為末白米一捻别研細末右再入乳鉢内研數百下煉蜜為丸如粟大細嚼熱湯下病在上食後在下食前出靨方右用蕎麥楷一擔不爛者燒灰存性入石灰半斤同灰一齊過令火减然後以熱水霖灰窩淋下灰水用鐡器内煑以潦起攪成膏子於靨上㸃自出或先以草莖刺破亦可又方桑柴灰石灰淋汁熬成膏草莖刺破㸃以新水沃之忌油膩等物燒湯火方多年廟上􅀈與走獸為末小油調塗燒湯火瘡立効又方生地黄汁入小油䗶同熬成膏磁器内盛用雞趐掃燙處又方培上青苔燒灰小油調塗燒燙處治燒燙方生地黄旋取新者爛搗取自然汁入小油黄䗶少許銀石器中熬成膏子用雞翎掃瘡上又方血餘灰用臘猪脂調塗又方寒水石燒過為細末水調塗之枯瘤方砒碙砂黄丹雄黄粉霜輕粉已上各等一錢班猫二十箇生用朱砂一錢乳香三錢没藥一錢同研為末粥糊為丸揑作碁子様爆乾先灸破瘤頂三炷為則上以瘡藥餅蓋上用黄蘗末以水調貼之數日自然乾枯落下又方以銅碌為末草刺破瘤摻在上以膏藥塗之治頭面生瘤子用蛛絲勒瘤子根三二日自然退落乳香散貼杖瘡腫痛大黄黄連黄蘗黄芩已上各三錢乳香叧研没藥叧研已上各一錢腦子少許右四味為末後入三味冷水調勻攤於緋絹上貼杖瘡上治疳瘡馬明退燒灰三錢輕粉少許乳香少許右研為細末先以温漿水洗凈乾摻之治疳瘡久不愈者海浮石燒紅醋淬數次金銀花右海石二停金銀花一停同為細末毎服二錢半如簽茶一般日用二服瘡在上食後在下食前服如病一年服藥半年則愈瀉肺湯治肺癰喘急坐卧不安桑白皮剉燒甜葶􅏣隔紙焙各一兩右二味麄末毎服三錢水一盞煎至六分去滓食後温服以利為度桔梗湯治肺癰吐膿桔梗剉炒一兩半甘草炙剉半兩右為麄末毎服六七錢水二盞煎至半盞去滓空心服湏臾吐膿立愈黄蘖散治鵬窠徼腰等瘡黄蘗白