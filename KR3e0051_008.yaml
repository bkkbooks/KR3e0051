  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3e0051_WYG_008-1a, image: WYG0745/WYG0745-0240c.png}
body:
  text: 儒門事親卷八金張從正撰內積形傷冷酒一百二十二戴人出遊道經陽夏問一舊友其人病已危矣戴人往視之其人曰我别無病三年前當隆暑時出村野有以煮酒饋豫者適村落無湯器冷飲數升便覺左脅下悶漸痛結硬至今不散針灸磨藥殊不得效戴人診其兩手脈俱沉實而有力先以獨聖散吐之一涌二三升色如煮酒香氣不變後服和脾散去濕藥五七日百脈沖和始知針灸無功增苦楚矣心下沉積一百二十三顯慶寺僧應公有沉積數年雖不卧床枕每於四更後心頭悶硬不能安卧須起行寺中習以為常人莫知為何病以藥請于戴人戴人令涌出膠涎一二升如黑礬水繼出黃緑水又下膿血數升自爾胸中如失巨山飲餌無算安眠至曉茶癖一百二十四一緇侣好茶成癖積在左脅戴人曰此與肥氣頗同然痎瘧不作便非肥氣雖病十年不勞一日况兩手脈沉細有積故然吾治無針灸之苦但小惱一餉可享壽盡期先以茶調散吐出宿茶水數升再以木如意揃之又涌數升皆作茶色次以三花神祐丸九十餘粒是夜瀉二十餘行膿水相兼燥糞瘀血雜然而下明日以除濕之劑使服十餘日諸苦悉蠲神清色瑩腹脹水氣一百二十五蹙踘張承應年幾五十腹如孕婦面黃食減欲作水氣或令服黃茋建中湯及溫補之劑小溲涸閉從戴人療焉戴人曰建中湯攻表之藥也古方用之攻裏已誤也今更以此取積兩重誤也先以涌劑吐之置火於其旁大汗之次與豬腎散四錢以舟車丸引之下六缶殊不困續下兩次約三十餘行腹平軟健啖如昔常仲明云向聞人言瀉五六缶人豈能任及聞張承應渠云誠然乃知養生與攻痾本自不同今人以補劑療病宜乎不效痃氣一百二十六王亭村一童子入門狀如鞠恭而行戴人曰痃氣也令解衣揣之二道如臂其家求療于戴人先刺其左如刺重紙剝然有聲而斷令按磨之立軟其右亦然觀者咸嗟異之或問曰石關穴也胸膈不利一百二十七沈丘王宰妻病胸膈不利口流涎沫自言咽下胃中常雷聲心間作微痛又復發昏胸乳之間灸瘢如碁化痰利膈等藥服之三載病亦依然其家知戴人痰藥不損來求之一涌而出雪白蟲一條長五六寸有口鼻牙齒走於涎中病者忿而斷之中有白髮一莖此正與徐文伯所吐宫人髮瘕一同蟲出立安冷積一百二十八戴人過醮都營中飲會鄰席有一卒説出妻事戴人問其故答曰吾婦為室女心下有冷積如覆杯按之如水聲以熱手尉之如水聚來已十五年矣恐斷我嗣是故棄之戴人曰公勿黜也如用吾藥病可除孕可得卒從之戴人診其脈沉而遲尺脈洪大而有力非無子之候也可不踰年而孕其良人笑曰試之先以三聖散吐涎一斗心下平軟次服白术調中湯五苓散後以四物湯和之不再月氣血合度數月而娠二子戴人常曰用吾此法無不子之婦此言不誣積塊一百二十九果菌劉子平妻腹中有塊如瓢十八年矣經水斷絶諸法無措戴人令一月之內涌四次下六次所去痰約一二桶其中不化之物有如葵菜者爛魚腸之狀涌時以木如意揃之覺病積如刮漸漸而平及積之既盡塊痕反窪如舊略無少損至是而面有童色經水復行若當年少可以有子肥氣積一百三十陽夏張主簿之妻病肥氣初如酒杯大發寒熱十五餘年後因性急悲感病益甚惟心下三指許無病滿腹如石片不能坐卧針灸匝矣徒勞人耳乃敬邀戴人而問之既至斷之曰此肥氣也得之季夏戊巳日在左脅下如覆杯久不愈令人發痎瘧痎瘧者寒熱也以苽蒂散吐之魚腥黃涎約一二缶至夜繼用舟車丸通經散投之五更黃涎膿水相半五六行凡有積處皆覺痛後用白术散當歸散和血流經之藥如斯涌泄凡三四次而方愈伏瘕一百三十一汴梁曹大使女年既笄病血瘕數年太醫宜企賢以破血等藥治之不愈企賢曰除得陳州張戴人方愈一日戴承語至汴京曹大使乃邀戴人問焉戴人曰小腸遺熱於大腸為伏瘕故結硬如塊面黃不月乃用涌泄之法數年之疾不再旬而效女由是得聘企賢問誰治之曹大使曰張戴人企賢立使人邀之停飲一百三十二一婦從年少時因大哭罷痛飲氷水困卧水停心下漸發痛悶醫氏咸以為冷積治之以溫熱劑及禁食冷物一聞茶氣病輒內作如此數年燎針燒艾瘡孔數千十餘年後小便赤黃大便祕悶兩目加昏積水轉甚流於兩脅世謂水癖或謂支飲􅓀漆稜荗攻磨之藥竟施之矣食日衰積日茂上至鳩尾旁至兩脅及臍下但發之時按之如水聲心腹結硬手不可近者月發五七次甚則欲死諸藥皆厭二十餘年求戴人發藥診其脈寸口獨沉而遲此胸中有痰先以苽蒂散涌痰五七升不數日再越痰水及斗又數日上涌數升凡三涌三下汗如水者亦三其積皆去以流濕飲之藥調之月餘大瘥積氣一百三十三寄西華縣庠山東顔先生有積二十年目視物不真細字不覩當心如頑石每發痛不可忍食減肉消黑皯滿面腰不能直因遇戴人令涌寒痰一大盍如片粉夜以舟車丸通經散下爛魚腸葵菜汁七八行病十去三四以熱漿粥投之復去痰一盆次日又以舟車丸通經散前後約百餘行略無少困不五六日面紅皯去食進目明心中空曠遂失頑石所在旬日外來謝沉積疑胎一百三十四修弓杜匠其子婦年三十有孕已歲半矣每發痛則召侍媼待之以為將産也一二日復故凡數次乃問戴人戴人診其脈澀而小斷之曰塊病也非孕也脈訣所謂澀脈如刀刮竹形主丈夫傷精女人敗血治之法下有病當瀉之先以舟車丸百餘粒後以調胃承氣湯加當歸桃仁用河水煎乘熱投之三兩日又以舟車丸桃仁承氣湯瀉青黃膿血雜然而下每更衣以手向下推之揉之則出後三二日又用舟車丸以豬腎散佐之一二日又以舟車丸通經如前數服病十去九俟晴明當未食時以針瀉三隂交穴不再旬塊已沒矣此與隔腹視五臟者復何異哉是胎非積一百三十五鬍王之妻病臍下積塊嘔食面黃肌瘦而不月或謂之乾血氣治之無效戴人見之曰孕也其人不信再三求治于戴人與之平藥以應其意終不肯下毒藥後月到果胎也人問何以别之戴人曰尺脈洪大也素問隂陽别論所謂隂摶陽别之脈外積形瘤一百三十六戴人在西華衆人皆訕以為吐瀉一日魏壽之與戴人入食肆中見一夫病一瘤正當目之上網內眥色如灰李下垂覆目之睛不能視物戴人謂壽之曰吾不待食熟立取此瘤魏未之信也戴人曰吾與爾取此瘤何如其人曰人皆不敢割戴人曰吾非用刀割别有一術焉其人從之乃引入一小室中令俯卧一床以繩束其胻刺乳中大出血先令以手揉其目瘤上亦刺出雀糞立平出户壽之大驚戴人曰人之有技可盡窺乎膠瘤一百三十七郜城戴人之鄉也一女子未嫁年十八兩手背皆有瘤一類雞距一類角丸腕不能釧向明望之如桃膠然夫家欲棄之戴人見之曰在手背為膠瘤在面者為粉瘤此膠瘤也以扉針十字刺破按出黃膠膿三兩匙立平瘤核更不再作婚事復成非素明者不敢用此法矣癭一百三十八新寨婦人年四十餘有癭三瓣戴人令以鹹吐之三涌三汗三下癭已半消次服化癭之藥遂大消去夫病在上者皆宜吐亦自有消息之法耳痔一百三十九趙君玉常病痔鳳眼草刺蝟皮槐根貍首之類皆用之或以乾薑作末塗豬肉炙食之大便燥結不利且痛後數日因病黃大涌瀉數次不言痔作􅏘先生偶記而書之君玉自識戴人之後痔更不發耳儒門事親卷八
