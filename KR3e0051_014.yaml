body:
  text: 儒門事親卷十四金張從正撰扁鵲華陀察聲色定死生訣要病人五臓已奪神明不守聲嘶者死病人循衣縫譫語者不可治病人隂陽俱絶掣衣撮空妄言者死病人妄語錯亂及不能言者不治熱病者可治病人隂陽俱絶失音不能言者三日半死病人兩目􅗃有黄色起者其病方愈病人面黄目青者至期而死重出在下文病人面黄目赤不死赤如衃血者死病人面黄目白者不死白如枯骨者死病人面黄目黒者不死黑如苔死病人面黑目青者不死病人面目俱黄者不死病人面青目白者死病人面黑目白者不死病人面赤目青者六日死病人面黄目青者九日必死是謂亂經飲酒當風邪入胃經膽氣妄泄目則為青雖天救亦不可生病人靣赤目白者十日死憂恚思心氣内索靣色反好急棺椁病人面白目黑者死此謂榮華已去血脉空索病人面黑目白八日死腎氣内傷病因留損病人面青目白五日死病人着床心痛短氣脾氣内竭後百日復愈能起傍徨因坐於地其上倚床能治此者也病人耳目鼻口有黑色起入于口者必死病人目無精光若土色不受飲食者四日死病人目精光及牙齒黑色者不治病人耳目及顴頰赤者死在五日中病人黑色出于額上髪際直鼻脊兩顴上者亦死在五日中病人黑色出天中下至上顴上者死病人及健人黑色若白色起入目及鼻口死在三日中病人及健人面忽如馬肝色望之如青近之如黑者死病人面黑直視惡風者死病人面黑唇青者死病人面青唇黑者死病人面黑兩脇下滿不能自轉反者死病人目不回直視者一日死病人頭目久痛卒視無所見者死病人隂結陽絶目睛脫恍惚者死病人隂陽竭絶目眶陷者死病人眉系傾者七日死病人口如魚口不能復閉而氣出多不反者死病人卧遺尿不覺者死病人尸臭者不可治肝病皮黑肺之日庚辛死心病目黑腎之日壬癸死脾病唇青肝之日甲乙死肺病頰赤目腫心之日丙丁死腎病靣腫唇黄脾之日戊巳死青欲如蒼璧之澤不欲如藍赤欲如帛裹朱不欲如赭白欲如鵝羽不欲如枯骨黑欲如黑漆不欲如炭黄欲如羅裹雄黄不欲如土目赤色者病在心白在肺黑在腎黄在脾青在肝黄色不可名者病在胸中診目病赤脉從上下者太陽病也從下上者陽明病也從外入内者少陽病也診寒熱瘰癧目中有赤脉從上下至瞳子見一脉一歳死見一脉半一歳半死見二脉二歳死見二脉半二歳半死見三脉三歳死診牙齒痛按其陽明之脉來太過者獨熱在右右熱熱在左左熱熱在上上熱熱在下下熱診血者脉多赤多熱多青多痛多黑多黄多痺多赤多黑多青皆見者寒熱身痛面色微黄齒垢黄爪甲上黄疸也安卧少黄赤脉小而濇者不嗜食診百病死生訣第七診傷寒熱盛脉浮大者生沉小者死傷寒已得汗脉沉小者生浮大者死温病三四日已下不得汗脉大疾者生脉細小難得者死不治温病穣穣大熱其脉細小者死千金穣穣作特行温病下利腹中痛甚者死不治温病汗不出出不至足者死厥逆汗出脉堅强急者生虛緩者死温病二三日身體熱腹滿頭痛食如故脉直而疾者八日死四五日頭痛腹痛而吐脉來細强十二日死八九日頭不疼身不痛目不變色不變而反利脉來喋喋按之不彈手時時心下堅十七日死熱病七八日脉不軟一作喘不散一作數者當有瘖瘖後三日温汗不出者死熱病七八日其脉微細小便不利加暴口燥脉代舌焦乾黑者死熱病未得汗脉盛躁疾得汗者生不得汗者難瘥熱病已得汗脉靜安者生脉躁者難治熱病已得汗大熱不去者亦死熱病已得汗熱未去脉微躁者慎不得刺治熱病發熱熱甚者其脉隂陽皆竭慎勿刺不汗出必下利診人被風不仁痿蹷其脉虛者生堅急疾者死診癲病虛則可治實則死診癲病脉實堅者生脉沉細者死又癲疾脉得大滑者久而自已其脉沉小急實不可療小堅急者亦不可療也診頭痛目痛久視無所見者死診人心腹積聚其脉堅强急者生虛弱者死又實强者生沉者死其脉大腹大脹四肢逆冷其人脉形長者死腹脹滿便血脉大時絶極下血小疾者死腸澼便血身熱則死寒則生腸澼下白沫脉沉則生浮則死腸澼下膿血脉懸絶則死滑大則生腸澼之屬身熱脉不懸絶滑大者生懸濇者死以臓期之腸澼下膿血脉沉小留連者生數疾且大有熱者死腸澼筋攣其脉小細安靜者生浮大緊者死洞泄食不化不得留下膿血脉微小連者𦂳急者死洩注脉緩時小結者生浮大數者死蚕蝕隂注其脉虚小者生𦂳急者死欬𠻳脉沉𦂳者死浮直者浮軟者生小沉伏匿者死欬𠻳羸瘦脉形堅大者死欬脫形發熱脉小堅急者死肌瘦下脫形熱不去者死欬而嘔腹脹且洩其脉弦急欲絶者死吐血衂血脉滑小弱者生實大者死汗若衂其脉小滑者生大躁者死吐血脉𦂳强者死滑者生吐血而欬上氣其脉數有熱不得卧者死上氣脉數者死謂損形故也上氣喘息低昻其脉滑手足温者生脉澁四肢寒者死上氣靣浮腫肩息其脉大不可治加利必死上氣注液其脉虛寜伏匿者生堅强者死寒氣上攻脉實而順滑者生實而逆滑者死太素云寒氣在上脉滿實何如曰實而滑則生實而逆則死矣其形盡滿何如曰舉形盡滿者脉急大堅尺滿而不應知是者順則生逆則死何謂順則生逆則死所謂順者手足温也逆者手足寒也病癉脉實大病久可治脉弦小堅急病久不可治消渴脉數大者生細小浮短者死消渴脉沉小者生實堅大者死水病脉洪大者可治㣲細不可治水病脹閉其脉浮大軟者生沉細虛小者死水病腹大如鼓脉實者生虛者死卒中惡咯血數升脉沉數細者死浮大疾快者生卒中惡腹大四肢滿脉大而緩者生𦂳大而浮者死緊細而㣲亦生瘡腰脊彊急瘈瘲皆不可治寒熱瘈瘲其脉代絶者死金瘡血出太多其脉虛細者生數實大者死金瘡出血脉沉小者生浮大者死斫瘡出血一二升脉來大二十日死斫刺俱有病多少血出不自止者其脉來大者七日死滑細者生從頭頓仆内有血腹脹滿其脉堅彊者生小弱者死人為百藥所中傷脉澁而疾者生微細者死洪大而遲者生千金遲作速人病甚而脉不調者難治脉洪大者易瘥人内外俱虛身體冷而汗出微嘔而煩擾手足厥逆體不得安靜者死脉實滿手足寒頭熱春秋生冬夏死老人脉㣲陽羸隂强者生脈大而加加者死隂弱陽彊脈至而代期月而死尺脈濇而堅為血實氣虚也其發病腹痛逆滿氣上行此為婦人胞中絶傷有惡血久成結瘕得病以冬時黍當赤而死尺脈細而㣲者血氣俱不足細而來有力者是糓氣不充病得節輙動棗葉生而死此病秋時得之左手寸口脈偏動乍大乍小不齊從寸至闗闗至尺三部之位其脈動各異不同其人病仲夏得之此脈桃花落而死右手寸口脈偏沉伏乍小乍大朝浮大而暮沉伏浮大即太過上出魚際沉伏即下不止闗中往來無常時復來者榆華枯而死右手尺部脈三十動一止有須臾還二十動止乍動乍踈連連相因因不與息數相應其人雖食糓猶不愈蘩草生而死右手尺部脈四十動而一止止而復來來逆如循張弓弦絙絙然如兩人共一索至立冬死病機諸風掉眩皆属於肝甲乙木也木欝達之諸寒收引皆属於腎壬癸水也水鬰泄之諸氣膹欝皆属於肺庚辛金也金欝折之諸濕腫滿皆属於脾戊己土也土欝奪之諸痛痒瘡瘍皆属於心丙丁火也火欝發之諸熱瞀瘈皆属於火諸厥固泄皆属下下謂下焦肝腎氣也夫守司於下腎泄之氣也門戸束要肝之氣也故厥固皆属下也厥謂氣逆也固謂禁固也滿氣逆上行反謂固不禁出入無度燥濕不恒皆由下焦主守也諸痿喘嘔皆属於上上謂上焦心肺氣也炎熱薄爍承熱分化肺之氣也熱欝化上故病属上焦諸禁鼓慄如喪神守皆属於火熱之内作諸頸項强皆属於濕太陽傷濕諸逆衝上皆属於火炎上之性用也諸脹腹大皆属於熱熱欝於内肺脹所生諸躁狂越皆属於火熱盛於胃及四末也諸暴强直皆属於風陽内欝而隂行於外諸病有聲鼓之如鼔皆属於熱諸熱胕腫疼酸驚駭皆属於火諸轉反戾水液渾濁皆属於熱反戾筋轉也水液小便也諸病水液澄徹清冷皆属寒上下所出及吐出溺出也諸嘔吐酸暴注下迫皆属於熱故大要曰謹守病機各司其属有者求之無者求之盛者責之虛者責之必先五勝踈其血氣令其調達而致和平此之謂也五勝謂五行更勝也標本運氣歌少陽從本為相火太隂從本濕土坐厥隂從中火是家陽明從中濕是我太陽少隂標本從隂陽二氣相包裹風從火斷汗之宜燥與濕兼下之可萬病能將火濕分徹開軒岐無縫鏁辨十二經水火分治法膽與三焦尋火治肝和包絡都無異脾肺嘗將濕處求胃與大腸同濕治惡寒表熱小膀温惡熱表寒心腎熾十二經最端的四經属火四經濕四經有熱有寒時攻裏解表細消息濕同寒火同熱寒熱到頭無兩説六分分來半分寒寒熱中停真浪舌休治風休治燥治得火時風燥了當觧表時莫攻裏當攻裏時莫觧表表裏如或兩可攻後先内外分多少敢謝軒岐萬世恩争奈醯雞笑天小治病不讀本草焉知藥性專泥藥性决不識病假饒識病未必得法識病得法工中之甲六陳藥有六味陳久為良狼茱半橘枳實􅏘黄十八反本草名言十八反半蔞貝蘝及攻烏藻㦸遂芫俱戰草諸參辛芍叛藜蘆運氣歌病如不是當年氣看與何年運氣同只向某年求治法方知都在至真中五不及坎一丁三土五中一七癸九是災宫勝復都來十一位誰知臓腑與宫同斷病人生死靈樞經云人有兩死而無兩生陽氣前絶隂氣後竭其人死身色必青隂氣前絶陽氣後竭其人死身色必赤故隂竭則身青而冷陽竭則身赤而温四因夫病生之類其有四焉一者始因氣動而内有所成二者始因氣動而外有所成三者不因氣動而病生於内四者不因氣動而病生於外因氣動而内成者謂積聚癥瘕瘤氣癭起結核癩癎之類是也不因氣動而病生於内者謂流飲澼食飢飽勞損宿食霍亂悲恐喜怒想慕憂結之類不因氣動而病生於外者謂瘴氣賊魅蟲蛇蠱毒蜚食鬼擊衝薄墜堕風寒暑濕斫射刺割撻朴之類也如此四類有獨治内而愈者有兼治内而愈者有獨治外而愈者有兼治外而愈者有先治内後治外而愈者有先治外後治内而愈者有湏解毒而攻擊者有湏無毒而調引者凡此之類方法所施或重或輕或緩或急或收或散或潤或燥或耎或堅方士之用見解不同各擅已心好丹非素故復問之五苦六辛五苦六辛從來無解蓋史家闕其疑也一日􅏘徵君以此質疑于張先生先生亦無所應行十五里忽然有所悟欣然廻告于麻徵君以為五苦者五臓為裏属隂宜用苦劑謂苦涌泄為隂六辛者六腑為表属陽宜用辛劑謂辛甘發散為陽此其義也徵君大服其識鍳深遠鑿昔人不傳之妙故曰知其要者一言而終不知其要者流散無窮儒門事親卷十四
