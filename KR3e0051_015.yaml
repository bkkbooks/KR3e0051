上各等分右為細末米飲調下一二錢服之玉筯散治小兒馬脾風甘草一寸水煎甘遂末一字右同油蜜生薑銀釵兒攪調下後用冷水半盞調奪命散奪命散治小兒胸膈喘滿㯽榔大黄黑白牽牛各等分皆當各半生熟用之右為細末蜜水調服治小兒斑瘡入眼麩炒蒺藜炙甘草羌活防風等分搗毎服二錢漿水下撥雲見日直到老治瘡疹黑陷鐡脚威靈仙一錢炒末腦子一分右為末用温水調下服之取下瘡痂為効治小兒黄瘦腹脹乾雞糞一兩丁香末一錢右為末蒸餅為丸如小荳大毎服二十丸米飲湯送下黄連散治小兒頭瘡川黄連黄蘗去麄皮草决明輕粉已上各等分右為細末用生小油調藥於瘡上塗之立愈治斑瘡倒壓方胡桃一箇燒灰存性乾胭脂三錢右為末用胡荽煎酒調下一錢服之又方人牙燒灰存性研入麝香少許毎服三錢温酒調下少許服之無時又方小猪兒尾尖取血三五㸃研入腦子少許新水調下食後與服之又方人中白臈月者最佳通風處以火煆成煤水調三五錢陷者自出消毒散治瘡疹巳未出咽㗋腫痛牛旁子二兩炒甘草半兩剉炒荆芥一分右為麄末毎服三錢水一盞半煎至七分去滓温服無時治小兒斑瘡入眼猪懸蹄甲二兩乾鍋内鹽泥固塗燒焦為末蝉殻二兩去土取末一兩羚羊角鎊為細末用研之右二味為末研入羚羊角細末一分拌勻毎用一字百日外兒服半錢三歳已上服三錢新水或温水調下日三四服夜一二服一年已外則難治之又方透耳藥朱砂一錢粉霜八分右研為細末水調少許用匙杓頭傾一兩㸃於耳内中後用白菊花菉荳皮糓精草夜明沙右四味為末用米泔半椀熬成去滓入乾柿十餘箇再同熬每日喫三兩箇仍飲煑乾柿湯又方治小兒斑瘡入眼朱砂腦子水銀麝香已上各等分右四味研為細末用水銀調滴入耳中發斑藥珠子七箇研碎用新水調勻服之破傷風邪第十三隂毒傷寒亦附于此長砂奪命丹鳯凰臺川烏頭生已上各二錢麝香少許朱砂少許右為細末棗肉和為丸如弹子大朱砂為衣鰾酒送下量病人年甲虛實加减用之小兒半丸以吐為度不止以葱白湯解之治破傷風病人耳塞并爪甲上刮末唾津調塗瘡口上立効無瘡口者難用治破傷風烏稍尾一箇兩頭尖四箇全蝎四箇右三味為細末另用石灰五升柴灰五升沸湯五升淋灰水澄清下藥熬之鐡鍋器内攪成膏子如稠用唾津調先用温漿水洗凈瘡口後塗藥即時藥行吐黄水一日以新水漱口即愈又方天南星半生半熟防風去蘆二味各等分右為末清油調塗瘡上追出黄水為驗又方白芷生用草烏頭尖生用去皮二味等分右為末毎用半錢冷酒一盞入葱白少許同煎服之如人行十里以葱白熱粥投之汗出立愈甚者不過二服又方蜈蚣散蜈蚣頭烏頭尖附子底蝎梢四味各等分右為細末毎用一字或半字熱酒調下如噤了牙關用此藥斡開灌之治隂毒傷寒破傷風草烏頭七箇文武火燒熟去牙頭麝香半錢朱砂一錢右為細末毎服一字以熱酒調下食前服之汗出為度忌猪兎魚鱉􅀈羖肉治隂毒傷寒用芥末以新水調膏藥貼臍上汗出為効又方以牡蠣乾薑末新水調塗手心握外腎汗出為効諸風疾證第十四不老丹治一切諸風常服烏髭注顔明目延年蒼术四斤米泔浸軟竹刀子刮去皮切作片子内一斤用椒三兩去白炒黄去椒一斤塩三兩炒黄去鹽一斤好醋一升煮汁盡一斤好酒一升煑令汁盡何首烏二斤米泔浸軟竹刀子刮去皮切作片子用瓦甑蒸先鋪黒荳三升乾棗二升上放何首烏上更鋪棗二升黑荳三升用炊单復著上用盆合定候荳棗香熟取出不用棗荳地骨皮去麄皮秤二斤右件於石臼内搗為細末候有椹汁搜和如軟麵劑相似磁盆内按平上更用椹汁藥上髙三指用紗綿帛覆䕶之晝取太陽夜取太隂使乾再搗羅為細末煉蜜和丸如梧桐子大空心温酒下六十丸忌五辛之物四仙丹春甲乙採杞葉夏丙丁採花秋庚辛採子冬壬癸採根皮右為細末以桑椹汁為丸毎服五十丸茶清酒任下起死神應丹治癱瘓四肢不舉風痺等疾蔴黄去根節河水五升熬去滓可成膏子五斤白芷二兩桑白皮二兩蒼术二兩去皮甘松二兩去土川芎三兩苦參三兩半加浮萍二兩已上各為細末用膏子和丸如弹子大毎服一丸温酒一盞化下臨卧服之微汗出勿慮如未安隔三二日再服手足即時輕快及治卒中風邪涎潮不利小兒驚風服之立効愈風丹芍藥川芎白殭蚕炒桔梗細辛去葉𦍑活已上各半兩麻黄去節防風去蘆白芷天麻全蝎炙已上各一兩甘草三錢南星半兩生薑製朱砂半兩為衣右為細末煉蜜為丸如弹子大毎服一丸細嚼茶酒吞下香芎散治偏正頭風貫芎香附子炒石膏亂紋者良水飛白芷甘草薄荷已上各一兩一方川烏頭半兩炮去臍皮用之右為細末毎服二錢温酒或茶清調下服之妙功十一丸治癎丁香木香沉香乳香麝香荆山稜炮廣茂炮黑牽牛㣲炒黄連雷丸炒鶴虱炒胡黄連黄芩大黄焙陳皮青皮雄黄熊膽甘草炙各二錢半亦小荳三百六十粒煑白丁香直尖者三百六十箇輕粉四錢芭荳七箇右二十三味為細末赤小荳爛煑研泥同蕎麵打糊和作十一丸朱砂為衣隂乾服時水浸一宿化一丸大便出隨病各有形状取出為驗或作化一畨不可再服曽經火灸者不治逺年愈効朱砂滚涎散治五癎朱砂水飛白礬生用亦石脂消石已上各等分右同為細末研蒜膏如丸菉荳大毎服三十丸食後荆芥湯下又方末砂不以多少水飛研為細末右用猪心血浸蒸餅為丸如菉荳大毎服二十丸空心金銀湯下之治諸風疥癬及癩浮萍一兩荆芥川芎甘草麻黄已上各半兩或加芍藥當歸右為麄末毎服一兩水一椀入葱白根荳䜴同煎至一半無時服汗出為度治癩塗眉法半夏生用羊糞燒已上各等分右為末生薑自然汁調塗五九散治癩地龍去土蝉殻白殭蚕凌霄全蝎已上各等九箇右同為末只作一服熱酒調下浴室中汗出粘臭氣為効苦參散治癘風苦參取頭末秤二兩猪肚一箇去脂右以苦參末摻猪肚内用線縫合隔宿煑軟取出洗去元藥先不喫飯五頓至第二日先飲新水一盞後将猪肚食之如吐了再食之食罷待一二時用肉湯調無憂散五七錢取出小虫一二萬為効後用皂角一斤不蛀者去皮弦及子搥碎用水四椀煑至一椀用生絹濾去滓再入苦參末攪熟稀麵糊膏子相似取出放冷後入餘藥相和藥附于後何首烏二兩防風一兩半芍藥五錢人參三錢當歸一兩焙右為細末入皂角膏子為丸如桐子大毎服三五十丸温酒或茶清送下不計時候日進三服後用苦參荆芥麻黄煎湯洗冷水腫黄疸第十五治通身黄腫苽蒂焙乾三四錢右為細末毎用半字於鼻内吹上日一度併吹三日如不愈後用黄芩末之煎湯五錢下治蠱氣取環腸草不以多少㬠乾水煎利小便為度治黄疸面目遍身如金色苽蒂一十四箇母丁香一箇黍米四十九粒右先搗苽蒂為末次入二味同為細末毎用半字夜卧令病人先噙水一口兩鼻内各半字吐了水令病人便睡至夜或明日取下黄水旋用熟帛揾了直候取水定便服黄連散病輕者五日重者半月黄連散治黄疸大小便秘澁壅熱黄連三兩川大黄二兩剉碎醋拌炒過用之黄芩甘草炙各一兩右為細末毎服二錢食後温水調下一日三服治水腫不利小便非其法也故内經云濕氣在上以苦吐之濕氣在下以苦㵼之吐㵼後長服益元散加海金沙煎以長流水服之則愈矣大忌脚膝上針刺出水取一時之効後必死矣尤忌房室濕麵酒醋鹽味犯之必死木通散治水腫海金沙舶上茴香巴㦸大㦸甘遂芫花木通滑石通草已上各等分右為細末毎服三錢以大麥麵和作餅子如當二錢大爛嚼生姜湯送下下痢泄㵼第十六治痢紫苑桔梗赤芍藥白术已上各等分右為細末毎服三五錢細切羊肝拌之作麵角兒燒服之後用白湯送下食前治痢杜蒺藜炒碾為末酒調下三兩服蒜豉丸治痢蒜為泥豉為末右二味相和作丸如梧桐子大米飲湯下五七十丸食前治大人小兒吐㵼腹脹胸膈痞閉五靈脂青皮陳皮硫黄芒硝已上各等分右將硝黄於銚子内以文武火鎔開用匙刮聚自然結成砂子取出研碎與前三藥同末麵糊為丸如菉荳大小兒麻子黄米大毎服二十丸量虛實加减米飲湯送下無時又方治瀉車前子不以多少右為細末毎服二錢米飲湯調下服之水糓分吐瀉止諸雜方藥第十七治消渴揀黄連二兩八九節者右剉如㕮咀以水一椀煎至半椀去滓頓服之立止百日還丹佛茄子樟柳根已上各等分右為末枸杞汁和為丸如雞頭大毎服十丸新水送下酒癥丸芭荳十六箇全蝎十五箇雄黄一塊白麵五兩右為末硏勻滴水丸如豌豆大毎服一丸如痛飲者二丸立應丸治臓腑泄痢膿血不止腹中疼痛乾姜一兩炮叧末百草霜一兩連皮芭荳一兩炒杏仁一兩同芭荳和皮炒黒色杵為泥後入霜研右用黄臘四兩鎔開䗶次入前四味用鐡器攪勻旋丸桐子大毎服三五丸甘草湯下白痢用乾姜湯下食前若水㵼温水下反胃黄蘗末熱酒調三五錢食後服之治小便多滑數不禁金剛骨為末以好酒調下三錢服之又方白茯苓去黒皮乾山藥去皮白礬水内湛過慢火焙乾用右二味各等分為細末稀米飲調下服之治卒淋痛芫花三錢茴香二錢㣲炒黄右為細末水煎服之治趼方以水調白麵稀稠得所糊趼上以紙封之明日便乾如不曽破者剥去麵便行治大便秘生麻子不以多少研爛水調服之坐劑治大便久秘攻之不透者用之又用蜜不計多少慢火熬令作劑稀則粘手硬則脆稀稠得所堪作劑搓作劑様如棗核大麄如筯長一寸許蘸小油内于肛門中坐良久自透有加塩少許以素問鹹以軟之交加飲子治久瘧不已山嵐瘴氣肉荳蔲十一箇麵裹燒一箇草荳䓻二箇同上法用厚朴二寸一半生用一半熟用生姜製過用之甘草二寸半一半生用一半炙用生薑二塊如棗紙裹煨半生半熟右為末毎服分一半水一椀銀石器内煎至一大盞去滓温服發日空心未愈則再服天真丸補虛損佛袈裟男用女女用男以新水四擔洗盡血水以酒煑爛為泥葳靈仙一兩當歸半兩􅒦砂一兩蓮子肉三兩炒熟乾地黄一兩酒浸廣茂半兩甘草二兩牡丹皮一兩牛膝一兩酒浸木香半兩白术一兩白茯苓一兩右為細末與君主同搗羅為細末酒浸蒸餅為丸梧桐子大毎服三五十丸日三服取雕青水蛭取隂乾為末先以白馬汗擦青處後用白馬汗調藥塗之治蚰蜒入耳中右用貓尿灌耳中立出取貓尿用盆盛貓以生薑擦牙又方黑驢乳灌耳中亦出又方以濕生䖝研爛塗於耳邊自出辟糓絶食第十八大荳五升淘净蒸三遍去皮為細末大麻子五升湯浸一宿漉出蒸三遍令口開去皮為細末糯米五升淘凈共白茯苓一處蒸熟白茯苓五兩去皮同上糯米一處蒸熟為用右將麻仁末一處搗爛如泥漸入豆黄末同和勻便團如拳大再入甑蒸從初更着火至半後夜住火至寅時出甑午時㬠乾搗為末服之以飽為度不得喫一切物用麻子汁下第一頓一月不飢第二頓四十日不飢第三頓一千日不飢第四頓永不飢顔色日增氣力加倍如渴飲麻仁汁轉更不渴滋潤五臓若待喫食時分用葵菜子三合為末煎湯放冷服之取其藥如後初間喫三五日白米稀粥湯少少喫之三日後諸般食飲無避忌此藥大忌欲事又方於苓餅子白茯苓四兩為末頭白麵一二兩右同調水煎餅麵稀調以黄䗶代油煿成煎餅䗶可用三兩飽食一頓便絶食至三日覺難受三日後氣力漸生熟菓芝蔴湯米飲凉水㣲用些小潤腸胃無令涸竭開食時用葵菜湯并米飲稀粥少少服之又方保命丹人參五兩麻子仁二兩炒去皮乾地黄苽蔞子炒兎絲子酒浸已上各二兩生地黄乾大棗各三兩大荳黄一升煮去沫黑附子一兩生用一兩炮去皮白茯苓茯神地骨皮去麄皮蔓精子煮熟杏仁去皮尖炒麥門冬炒去心用地膚子蒸七遍黍米作粉粳米作粉白糯米作粉天門冬去心車前子蒸側栢葉煮三遍已上各二兩半右同為細末各㨂選精粹者臈月内合者妙他時不可合日月交蝕不可合如合時湏揀好日凈室焚香志心脩合勿令雞犬婦人見又将藥末用䗶一斤半濾去滓白蜜一斤共二斤半一處鎔開和勻入臼杵二千下㣲入酥油丸如梧桐子大毎服十丸服至五日如來日服藥隔宿先喫糯米一頓粳米白麵皆可次日空心用糯米粥飲送下如路行人服遇如好食喫不妨要止便止如喫些小蒸餅爛嚼嚥或乾菓子以助藥力不喫更妙忌塩醋日後退下藥來於長流水中洗净再服可百年不飢儒門事親卷十五
