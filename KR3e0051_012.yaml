杜仲三兩去粗皮炒牛膝乙兩酒浸澤瀉乙兩熟地黃乾乙兩山茱萸乙兩茯苓去皮乙兩巴㦸乙兩去心赤石脂乙兩右為細末煉蜜和丸桐子大每服二三十丸食前溫酒下米飲亦可當歸丸當歸香附子炒杜蒺藜芍藥各等分右為末酒糊為丸如小豆大每服三五十丸米飲下香薷湯香薷五錢去土厚朴五錢闕製白萹豆二錢半生炒右為末每服三錢水一盞入酒煎去滓溫服石葦散石葦去毛木通各分二兩當歸甘草王不留行已上各一兩滑石白术蘧麥葵子芍藥已上各三兩右為細末每服二錢煎小麥湯調下妙功丸京三稜乙兩炮川烏四錢生去皮大黃乙兩已上同為細末好醋半升熬膏不破積水丸神麯麥蘖已上各一兩乾薑二錢炒裂用芭豆兩箇去皮油心半夏半兩茴香乙兩炒香官桂牽牛三兩㨂淨右為細末用膏丸小豆大生薑湯下十丸十五丸溫凉水亦可以意加減以利為度人參散石膏甘草已上各一兩滑石四兩寒水石二兩人參半兩右為末每服二錢溫水調下食後茴香丸茴香八兩炒川練子炒川烏炮去皮威靈仙洗去土防風去蘆陳皮已上各三兩地龍乙兩去土微炒烏藥五兩赤小豆八兩右為末酒糊為丸每服三五丸茶酒下七宣丸大黃濕紙裹煨枳實麩炒木香柴胡去蘆訶子皮各五兩桃仁六兩炒去皮尖甘草四兩炒右為末煉蜜和丸如桐子大每服三十丸酒下人參調中湯沈香二兩木香白豆蔲乙兩用仁甘草乙分腦子乙錢射香半錢人參半兩右為細末每服半錢用沸湯㸃服或入生薑鹽少許食後服烏金散當歸乙兩自然銅金色者煆為末醋熬乙兩烏金石鐵炭是三兩大黃乙兩童子小便浸用右為末每服二錢紅花酒半盞童子小便半盞同調下食前日二服沈香降氣湯沈香木香􅒦砂仁白豆蔲仁青皮去白陳皮去白廣荗煨枳實麩炒已上各一兩蘿白子另末乙兩黑牽牛末二兩大黃二兩炒右為末生薑汁浸蒸餅為丸如桐子大每服三十丸橘皮湯下枳术丸治氣不下降胸膈滿悶枳實麩炒白术各半兩右為細末燒飯為丸如桐子大每服五十丸諸飲送下儒門事親卷十二
